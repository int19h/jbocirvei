name: check

on:
  push:
    branches: [tools]
  pull_request:
    branches: [tools]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Only the tested commit: the tests read the working tree alone, and a
      # full fetch would also download every commit of main.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Tests of the tools, and a sample check of determinism
        run: uv run pytest
      - name: Checks of lint, format, compilation and whitespace
        run: |
          uv run ruff check tools/jbocirvei_tools tools/tests
          uv run ruff format --check tools/jbocirvei_tools tools/tests
          uv run python -m compileall -q tools/jbocirvei_tools
          git diff --check
